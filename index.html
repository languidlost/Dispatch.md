<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dispatch.md — Markdown Social Queue &amp; Scheduler</title>
    <meta
      name="description"
      content="Static Markdown-to-social publishing queue with automated snipping rules, Google Drive & Photos sync, and Facebook, Instagram, and X scheduling for GitHub Pages."
    />
    <meta property="og:title" content="Dispatch.md — Markdown Social Queue & Scheduler" />
    <meta
      property="og:description"
      content="Static Markdown-to-social publishing queue with automated snipping rules, Google Drive & Photos sync, and Facebook, Instagram, and X scheduling for GitHub Pages."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>
    <script>
      (function () {
        var bootErrors = [];
        function showBootDiagnostic(reason) {
          if (window.__DISPATCH_MOUNTED__) return;
          var root = document.getElementById('root');
          if (!root) return;
          var scripts = Array.prototype.slice.call(document.querySelectorAll('script[src]'));
          var hasRawTsx = scripts.some(function (s) {
            return (s.getAttribute('src') || '').indexOf('/src/main.tsx') !== -1;
          });
          var title = hasRawTsx
            ? 'GitHub Pages is serving uncompiled source files'
            : 'Application failed to start';
          var guidance = hasRawTsx
            ? 'This page is serving the raw repository index.html (/src/main.tsx) instead of the compiled dist/ build. In GitHub Repository Settings → Pages → Build and deployment → Source, select "GitHub Actions" and push to trigger the workflow.'
            : 'Check the browser developer console for details. Diagnostic: ' + (reason || 'Bundle did not mount.');
          root.innerHTML =
            '<div style="max-width:560px;margin:64px auto;padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;font-family:system-ui,-apple-system,sans-serif;color:#0f172a;">' +
            '<h1 style="font-size:18px;font-weight:700;margin:0 0 8px;">' + title + '</h1>' +
            '<p style="font-size:14px;line-height:1.5;color:#475569;margin:0 0 12px;">' + guidance + '</p>' +
            (bootErrors.length
              ? '<pre style="font-size:12px;background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:8px;overflow:auto;color:#b91c1c;margin:0;">' +
                bootErrors.join('\n').replace(/</g, '&lt;') +
                '</pre>'
              : '') +
            '</div>';
        }
        window.addEventListener(
          'error',
          function (e) {
            if (window.__DISPATCH_MOUNTED__) return;
            var msg =
              (e && e.message) ||
              (e && e.target && e.target.src ? 'Failed to load script: ' + e.target.src : 'Script load error');
            bootErrors.push(msg);
            showBootDiagnostic(msg);
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          if (window.__DISPATCH_MOUNTED__) return;
          var msg = (e && e.reason && (e.reason.message || String(e.reason))) || 'Unhandled promise rejection';
          bootErrors.push(msg);
          showBootDiagnostic(msg);
        });
        setTimeout(function () {
          if (!window.__DISPATCH_MOUNTED__) {
            showBootDiagnostic('Timed out waiting for application bundle to mount.');
          }
        }, 3000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
